<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comment ca ?!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: 'Dancing Script', cursive;
  }

  .text-top {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 8vw, 80px);
    color: #ff2222;
    text-align: center;
    letter-spacing: 4px;
    animation: shake 0.4s ease-in-out infinite;
    z-index: 10;
    text-shadow: 0 0 20px rgba(255,34,34,0.5);
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-8px) rotate(-2deg); }
    75% { transform: translateX(8px) rotate(2deg); }
  }

  #bgcanvas { position: fixed; inset: 0; z-index: 0; }

  .person-wrap { position: relative; z-index: 10; }

  .text-bottom {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 6vw, 60px);
    color: #fff;
    text-align: center;
    z-index: 10;
    letter-spacing: 6px;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.05); }
  }

  .btn-retry {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 700;
    padding: 12px 36px;
    border-radius: 60px;
    border: 2px solid #e0255a;
    background: transparent;
    color: #e0255a;
    cursor: pointer;
    z-index: 10;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn-retry:hover {
    background: #e0255a;
    color: #fff;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<canvas id="bgcanvas"></canvas>

<div class="text-top">Comment ça ?!</div>

<div class="person-wrap">
  <canvas id="person" width="260" height="300"></canvas>
</div>

<div class="text-bottom">T'ES SAH</div>

<button class="btn-retry" onclick="window.location.href='index.html'">Retenter ta chance</button>

<script>
/* ---- Background angry particles ---- */
const bg = document.getElementById('bgcanvas');
const bgc = bg.getContext('2d');
function resizeBg() { bg.width = window.innerWidth; bg.height = window.innerHeight; }
resizeBg();
window.addEventListener('resize', resizeBg);
const particles = Array.from({length: 40}, () => ({
  x: Math.random() * bg.width, y: Math.random() * bg.height,
  r: Math.random() * 4 + 1,
  hue: Math.random() * 40, // red/orange range
  vy: -(Math.random() * 0.8 + 0.2),
  vx: (Math.random() - 0.5) * 0.5,
}));
function drawBg() {
  bgc.clearRect(0, 0, bg.width, bg.height);
  particles.forEach(p => {
    p.hue = (p.hue + 0.5) % 40;
    p.y += p.vy; p.x += p.vx;
    if (p.y < 0) { p.y = bg.height; p.x = Math.random() * bg.width; }
    bgc.beginPath();
    bgc.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgc.fillStyle = `hsla(${p.hue}, 100%, 55%, 0.4)`;
    bgc.fill();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

/* ---- Angry Person ---- */
const pc = document.getElementById('person');
const pctx = pc.getContext('2d');
let t = 0;

function drawPerson(t) {
  pctx.clearRect(0, 0, 260, 300);

  const bounce = Math.sin(t * 6) * 5;
  const sway = Math.sin(t * 5) * 8;
  const armL = -40 + Math.sin(t * 6) * 15; // raised angry arm
  const armR = 40 - Math.sin(t * 6 + 1) * 15;
  const legL = Math.sin(t * 6) * 12;
  const legR = -Math.sin(t * 6) * 12;

  pctx.save();
  pctx.translate(130, 150 + bounce);

  // Shadow
  pctx.save();
  pctx.scale(1, 0.3);
  pctx.beginPath();
  pctx.ellipse(0, 120, 28, 8, 0, 0, Math.PI * 2);
  pctx.fillStyle = 'rgba(0,0,0,0.4)';
  pctx.fill();
  pctx.restore();

  // Legs
  [[-12, legL], [12, legR]].forEach(([lx, angle]) => {
    pctx.save();
    pctx.translate(lx + sway * 0.15, 52);
    pctx.rotate((angle * Math.PI) / 180);
    pctx.beginPath();
    pctx.moveTo(0, 0);
    pctx.lineTo(lx < 0 ? -4 : 4, 42);
    pctx.lineWidth = 11;
    pctx.strokeStyle = '#222255';
    pctx.lineCap = 'round';
    pctx.stroke();
    // shoe
    pctx.beginPath();
    pctx.ellipse(lx < 0 ? -6 : 6, 44, 10, 6, lx < 0 ? -0.2 : 0.2, 0, Math.PI * 2);
    pctx.fillStyle = '#111';
    pctx.fill();
    pctx.restore();
  });

  // Body
  pctx.save();
  pctx.translate(sway * 0.2, 0);
  pctx.beginPath();
  pctx.roundRect(-22, -10, 44, 65, 10);
  pctx.fillStyle = '#cc2200';
  pctx.fill();
  // shirt detail
  pctx.beginPath();
  pctx.moveTo(0, -10); pctx.lineTo(0, 20);
  pctx.lineWidth = 2; pctx.strokeStyle = '#991100';
  pctx.stroke();
  pctx.restore();

  // Left arm (raised, pointing finger)
  pctx.save();
  pctx.translate(-22 + sway * 0.2, -2);
  pctx.rotate(((armL - 20) * Math.PI) / 180);
  pctx.beginPath();
  pctx.moveTo(0, 0); pctx.lineTo(-18, -28);
  pctx.lineWidth = 10; pctx.strokeStyle = '#cc2200'; pctx.lineCap = 'round'; pctx.stroke();
  // hand
  pctx.beginPath();
  pctx.arc(-20, -32, 7, 0, Math.PI * 2);
  pctx.fillStyle = '#f5c5a0'; pctx.fill();
  // pointing finger
  pctx.beginPath();
  pctx.moveTo(-20, -39); pctx.lineTo(-22, -52);
  pctx.lineWidth = 5; pctx.strokeStyle = '#f5c5a0'; pctx.stroke();
  pctx.restore();

  // Right arm (on hip / waving)
  pctx.save();
  pctx.translate(22 + sway * 0.2, -2);
  pctx.rotate(((armR + 20) * Math.PI) / 180);
  pctx.beginPath();
  pctx.moveTo(0, 0); pctx.lineTo(16, 24);
  pctx.lineWidth = 10; pctx.strokeStyle = '#cc2200'; pctx.lineCap = 'round'; pctx.stroke();
  // hand on hip
  pctx.beginPath();
  pctx.arc(18, 28, 7, 0, Math.PI * 2);
  pctx.fillStyle = '#f5c5a0'; pctx.fill();
  pctx.restore();

  // Neck
  pctx.save();
  pctx.translate(sway * 0.25, -12);
  pctx.beginPath();
  pctx.roundRect(-7, -12, 14, 14, 4);
  pctx.fillStyle = '#f5c5a0'; pctx.fill();
  pctx.restore();

  // Head
  pctx.save();
  pctx.translate(sway * 0.4, -50);

  // head shape
  pctx.beginPath();
  pctx.ellipse(0, 0, 28, 32, 0, 0, Math.PI * 2);
  pctx.fillStyle = '#f5c5a0';
  pctx.fill();
  pctx.strokeStyle = '#d4a07a';
  pctx.lineWidth = 1.5;
  pctx.stroke();

  // Hair (short, messy angry)
  pctx.fillStyle = '#1a0a00';
  pctx.beginPath();
  pctx.ellipse(0, -24, 28, 14, 0, 0, Math.PI, true);
  pctx.fill();
  // messy spikes
  [[-20, -32], [-10, -36], [0, -38], [10, -36], [20, -32]].forEach(([sx, sy]) => {
    pctx.beginPath();
    pctx.moveTo(sx - 4, sy + 6);
    pctx.lineTo(sx, sy - 2 + Math.sin(t * 8 + sx) * 2);
    pctx.lineTo(sx + 4, sy + 6);
    pctx.fillStyle = '#1a0a00';
    pctx.fill();
  });

  // Angry eyebrows (diagonal, furrowed)
  pctx.lineWidth = 3.5;
  pctx.strokeStyle = '#333';
  pctx.lineCap = 'round';
  // left brow (angled down toward center)
  pctx.beginPath();
  pctx.moveTo(-18, -14); pctx.lineTo(-7, -10);
  pctx.stroke();
  // right brow
  pctx.beginPath();
  pctx.moveTo(18, -14); pctx.lineTo(7, -10);
  pctx.stroke();

  // Eyes (squinted angry)
  pctx.fillStyle = '#111';
  // left eye squint
  pctx.beginPath();
  pctx.ellipse(-10, -4, 6, 3, -0.2, 0, Math.PI * 2);
  pctx.fill();
  // right eye squint
  pctx.beginPath();
  pctx.ellipse(10, -4, 6, 3, 0.2, 0, Math.PI * 2);
  pctx.fill();

  // Mouth (angry frown / shouting)
  const mouthOpen = (Math.sin(t * 6) + 1) * 4 + 4;
  pctx.beginPath();
  pctx.ellipse(0, 16, 10, mouthOpen, 0, 0, Math.PI * 2);
  pctx.fillStyle = '#882200';
  pctx.fill();
  pctx.beginPath();
  pctx.moveTo(-10, 13);
  pctx.quadraticCurveTo(0, 8, 10, 13);
  pctx.lineWidth = 2.5;
  pctx.strokeStyle = '#d4a07a';
  pctx.stroke();

  // Cheeks red (angry flush)
  pctx.globalAlpha = 0.35;
  pctx.beginPath(); pctx.arc(-18, 6, 8, 0, Math.PI * 2);
  pctx.fillStyle = '#ff4444'; pctx.fill();
  pctx.beginPath(); pctx.arc(18, 6, 8, 0, Math.PI * 2);
  pctx.fill();
  pctx.globalAlpha = 1;

  // Anger veins (on forehead)
  pctx.strokeStyle = '#cc0000';
  pctx.lineWidth = 2;
  pctx.lineCap = 'round';
  pctx.beginPath();
  pctx.moveTo(-14, -22); pctx.lineTo(-10, -26); pctx.lineTo(-14, -30);
  pctx.stroke();

  // Exclamation marks floating above head
  const excY = Math.sin(t * 4) * 4;
  pctx.font = 'bold 20px serif';
  pctx.fillStyle = '#ff2222';
  pctx.globalAlpha = 0.9;
  pctx.fillText('!', -36, -44 + excY);
  pctx.fillText('!', 28, -44 - excY);
  pctx.globalAlpha = 1;

  pctx.restore();
  pctx.restore();
}

function animate() {
  t += 0.04;
  drawPerson(t);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
